<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSH Studio 正在启动...</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
    }
    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      fill: var(--accent);
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #a5d6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .loader-bar {
      width: 220px;
      height: 4px;
      background: #21262d;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #1f6feb, #58a6ff);
      border-radius: 2px;
      animation: loading 1.5s infinite ease-in-out;
    }
    .status-text {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }
    @keyframes loading {
      0% { left: -40%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>

</html>
